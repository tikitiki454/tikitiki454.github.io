<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080910"><title>Secret Arcade · Nebula.Now</title>
<style>
:root{color-scheme:dark;--bg:#080910;--panel:#10121e;--edge:#2e3349;--accent:#a8ffcb;--text:#f5f7ff;--muted:#9298b4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#202b42,transparent 40%),radial-gradient(circle at 100% 80%,#1e1935,transparent 45%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:1080px;margin:auto;padding:25px 22px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--edge)}.logo{font-size:13px;color:var(--accent);font-weight:750;letter-spacing:2px}.back{border:1px solid var(--edge);background:#171a28;border-radius:10px;padding:10px 14px;font-size:13px}h1{font-size:clamp(35px,6vw,64px);letter-spacing:-2px;margin:43px 0 12px}p{color:var(--muted);line-height:1.6}h1 em{font-style:normal;color:var(--accent)}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:3px;margin-top:35px}.games{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0}.game{color:var(--text);text-align:left;border:1px solid var(--edge);border-radius:15px;background:linear-gradient(145deg,#171b2b,#0b0e18);padding:20px;min-height:150px;transition:.2s}.game:hover,.game.active{border-color:var(--accent);transform:translateY(-3px)}.game b{display:block;margin:14px 0 5px}.game small{color:var(--muted)}.emoji{font-size:29px}.stage{border:1px solid var(--edge);border-radius:18px;background:rgba(12,15,25,.9);padding:24px;min-height:460px}.stage-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stage h2{margin:0;font-size:23px}.hint{font-size:13px;margin:6px 0 18px}.btn{border:1px solid #3a4559;border-radius:10px;background:#1b2333;color:#fff;padding:10px 16px}.btn:hover{border-color:var(--accent)}.score{color:var(--accent);font-weight:bold}.center{display:flex;align-items:center;flex-direction:column;gap:15px}.board{display:grid;gap:5px;background:#070a12;padding:9px;border:1px solid #343c52;border-radius:12px;touch-action:none}.cell{width:21px;height:21px;background:#171d2b;border-radius:3px}.cell.snake{background:#a8ffcb}.cell.head{background:#37d98b}.cell.food{background:#fb829d;border-radius:50%}.dpad{display:grid;grid-template-columns:repeat(3,44px);gap:5px;margin-top:12px}.dpad button{height:42px;border:1px solid #45516a;border-radius:8px;background:#22283c;color:#fff}.ttt{display:grid;grid-template-columns:repeat(3,90px);gap:8px;margin:22px auto}.ttt button{width:90px;height:90px;border-radius:12px;background:#161d2c;border:1px solid #36435c;color:var(--accent);font-size:48px}.memory{display:grid;grid-template-columns:repeat(4,minmax(55px,90px));gap:9px;margin:20px auto}.memory button{height:80px;border:1px solid #36435c;border-radius:12px;background:#20253a;color:#fff;font-size:30px}.memory button.matched{border-color:var(--accent);background:#1b4439}.reaction{height:250px;max-width:560px;width:100%;border:1px solid #414b66;border-radius:15px;display:grid;place-items:center;text-align:center;padding:20px;font-size:20px;font-weight:bold;user-select:none;cursor:pointer;background:#34283b}.reaction.ready{background:#20775a}.reaction.wait{background:#8b423a}.foot{color:#6d758b;font-size:12px;margin-top:30px;text-align:center}@media(max-width:700px){.games{grid-template-columns:repeat(2,1fr)}.game{padding:13px;min-height:125px}.stage{padding:15px}.cell{width:min(5.3vw,21px);height:min(5.3vw,21px)}.ttt{grid-template-columns:repeat(3,75px)}.ttt button{width:75px;height:75px}.memory button{height:62px}}
</style></head><body><main class="wrap"><div class="top"><div class="logo">◇ NEBULA / SECRET ARCADE</div><a class="back" href="index.html">← Back to Nebula.Now</a></div><div class="eyebrow">HIDDEN ZONE / LEVEL 01</div><h1>Welcome to the <em>Arcade.</em></h1><p>A secret collection of games you can play right here. No accounts, downloads, or external game sites required.</p><div class="games" role="tablist" aria-label="Choose game"><button class="game active" data-game="snake"><span class="emoji">🐍</span><b>Snake</b><small>Eat, grow, survive</small></button><button class="game" data-game="ttt"><span class="emoji">❎</span><b>Tic-Tac-Toe</b><small>Play against the computer</small></button><button class="game" data-game="memory"><span class="emoji">🧠</span><b>Memory Match</b><small>Find all the pairs</small></button><button class="game" data-game="reaction"><span class="emoji">⚡</span><b>Reaction Test</b><small>Test your reflexes</small></button></div><section class="stage" id="stage" aria-live="polite"></section><div class="foot">Secret Arcade · All games run locally in your browser · Nebula.Now</div></main>
<script>
(()=>{'use strict';const stage=document.getElementById('stage');let active='snake',cleanup=()=>{};const buttons=[...document.querySelectorAll('[data-game]')];const pick=(name)=>{cleanup();cleanup=()=>{};active=name;buttons.forEach(b=>b.classList.toggle('active',b.dataset.game===name));({snake,ttt,memory,reaction})[name]()};buttons.forEach(b=>b.addEventListener('click',()=>pick(b.dataset.game)));
function snake(){stage.innerHTML='<div class="stage-head"><h2>🐍 Snake</h2><button class="btn" id="restart">Restart</button></div><p class="hint">Use arrow keys / WASD or the touch controls. Eat the pink food and avoid walls and yourself. <span class="score" id="sScore">Score: 0</span></p><div class="center"><div class="board" id="snakeBoard" style="grid-template-columns:repeat(18,1fr)"></div><div class="dpad"><span></span><button data-d="0,-1">↑</button><span></span><button data-d="-1,0">←</button><button data-d="0,1">↓</button><button data-d="1,0">→</button></div><div id="sMsg" class="score">Press an arrow key or tap a direction to start</div></div>';const board=document.getElementById('snakeBoard'),score=document.getElementById('sScore'),msg=document.getElementById('sMsg');const cells=[];for(let i=0;i<324;i++){let div=document.createElement('div');div.className='cell';board.append(div);cells.push(div)}let body,food,dir,next,timer,running,over;const foodSpawn=()=>{let spots=[];for(let i=0;i<324;i++)if(!body.some(p=>p.y*18+p.x===i))spots.push(i);if(!spots.length){gameOver('You win!');return}let v=spots[Math.floor(Math.random()*spots.length)];food={x:v%18,y:Math.floor(v/18)}};const draw=()=>{cells.forEach(c=>c.className='cell');if(food)cells[food.y*18+food.x].classList.add('food');body.forEach((p,i)=>cells[p.y*18+p.x].classList.add(i?'snake':'head'));score.textContent='Score: '+(body.length-3)};function reset(){clearInterval(timer);body=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir={x:1,y:0};next={...dir};running=false;over=false;foodSpawn();msg.textContent='Press an arrow key or tap a direction to start';draw()}function gameOver(t){clearInterval(timer);running=false;over=true;msg.textContent=t||'Game over — press Restart'}function step(){dir=next;const h={x:body[0].x+dir.x,y:body[0].y+dir.y},eat=food&&h.x===food.x&&h.y===food.y;if(h.x<0||h.x>=18||h.y<0||h.y>=18||body.slice(0,eat?undefined:-1).some(p=>p.x===h.x&&p.y===h.y)){gameOver();return}body.unshift(h);if(eat){foodSpawn()}else body.pop();draw()}function change(x,y){if(over||x===-dir.x&&y===-dir.y)return;next={x,y};if(!running){running=true;msg.textContent='Good luck!';timer=setInterval(step,125)}}function keys(e){const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(m[e.key]){e.preventDefault();change(...m[e.key])}}document.addEventListener('keydown',keys);stage.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>change(...b.dataset.d.split(',').map(Number)));document.getElementById('restart').onclick=reset;let start=null;board.addEventListener('touchstart',e=>{start=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});board.addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start[0],dy=e.changedTouches[0].clientY-start[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)change(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0);start=null},{passive:true});cleanup=()=>{document.removeEventListener('keydown',keys);clearInterval(timer)};reset()}
function ttt(){stage.innerHTML='<div class="stage-head"><h2>❎ Tic-Tac-Toe</h2><button class="btn" id="tRestart">New round</button></div><p class="hint">You are X. The computer is O. Make three in a row!</p><div class="center"><div class="ttt" id="tBoard"></div><div id="tMsg" class="score"></div></div>';const b=document.getElementById('tBoard'),msg=document.getElementById('tMsg');let cells,ended;const win=a=>[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(line=>line.every(i=>a[i]===a[line[0]]&&a[i]));function start(){cells=Array(9).fill('');ended=false;msg.textContent='Your turn';render()}function render(){b.innerHTML='';cells.forEach((v,i)=>{let btn=document.createElement('button');btn.textContent=v;btn.disabled=!!v||ended;btn.setAttribute('aria-label','Cell '+(i+1)+(v?': '+v:''));btn.onclick=()=>move(i);b.append(btn)})}function move(i){if(ended||cells[i])return;cells[i]='X';if(finish())return;let avail=cells.map((x,j)=>x?-1:j).filter(j=>j>=0);let choice=avail.find(j=>{let a=[...cells];a[j]='O';return win(a)});if(choice===undefined)choice=avail.find(j=>{let a=[...cells];a[j]='X';return win(a)});if(choice===undefined)choice=avail.includes(4)?4:avail[Math.floor(Math.random()*avail.length)];cells[choice]='O';finish();render()}function finish(){if(win(cells)){ended=true;msg.textContent=cells.filter(Boolean).length%2?'You win! 🎉':'Computer wins!';render();return true}if(cells.every(Boolean)){ended=true;msg.textContent='It’s a draw!';render();return true}render();return false}document.getElementById('tRestart').onclick=start;start()}
function memory(){stage.innerHTML='<div class="stage-head"><h2>🧠 Memory Match</h2><button class="btn" id="mRestart">Shuffle</button></div><p class="hint">Flip cards to find matching pairs. <span class="score" id="mScore"></span></p><div class="center"><div class="memory" id="mBoard"></div><div class="score" id="mMsg"></div></div>';const board=document.getElementById('mBoard'),score=document.getElementById('mScore'),msg=document.getElementById('mMsg');let deck,open,matched,moves,lock,timeout;function start(){clearTimeout(timeout);deck=[...'🍎🍇🍒🍋🍉🥝🍍🍓'];deck=[...deck,...deck].sort(()=>Math.random()-.5);open=[];matched=new Set();moves=0;lock=false;msg.textContent='';render()}function render(){score.textContent='Moves: '+moves+' | Pairs: '+(matched.size/2)+'/8';board.innerHTML='';deck.forEach((v,i)=>{let btn=document.createElement('button');let show=open.includes(i)||matched.has(i);btn.textContent=show?v:'?';btn.classList.toggle('matched',matched.has(i));btn.setAttribute('aria-label',show?v:'Hidden card');btn.onclick=()=>flip(i);board.append(btn)})}function flip(i){if(lock||matched.has(i)||open.includes(i))return;open.push(i);if(open.length===2){moves++;if(deck[open[0]]===deck[open[1]]){open.forEach(x=>matched.add(x));open=[];if(matched.size===16)msg.textContent='All pairs found — amazing! 🎉'}else{lock=true;timeout=setTimeout(()=>{open=[];lock=false;render()},850)}}render()}document.getElementById('mRestart').onclick=start;cleanup=()=>clearTimeout(timeout);start()}
function reaction(){stage.innerHTML='<div class="stage-head"><h2>⚡ Reaction Test</h2><button class="btn" id="rRestart">Reset</button></div><p class="hint">Click the box to start. Wait until it turns green, then click as fast as you can.</p><div class="center"><div class="reaction" id="reactionBox" role="button" tabindex="0">Click to begin</div><div id="rMsg" class="score">Best: —</div></div>';const box=document.getElementById('reactionBox'),msg=document.getElementById('rMsg');let mode='idle',timer,started,best=Infinity;function reset(){clearTimeout(timer);mode='idle';box.className='reaction';box.textContent='Click to begin';msg.textContent='Best: '+(Number.isFinite(best)?best+' ms':'—')}function hit(){if(mode==='idle'||mode==='done'){mode='wait';box.className='reaction wait';box.textContent='Wait for green...';timer=setTimeout(()=>{mode='ready';started=performance.now();box.className='reaction ready';box.textContent='CLICK NOW!'},1000+Math.random()*2600)}else if(mode==='wait'){clearTimeout(timer);mode='done';box.className='reaction';box.textContent='Too early! Click to retry'}else if(mode==='ready'){let ms=Math.round(performance.now()-started);best=Math.min(best,ms);mode='done';box.className='reaction';box.textContent=ms+' ms! Click to try again';msg.textContent='Best: '+best+' ms'}}box.onclick=hit;box.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit()}};document.getElementById('rRestart').onclick=reset;cleanup=()=>clearTimeout(timer);reset()}
pick('snake')})();
</script></body></html>
