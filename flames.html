<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nebula.Flames — Hidden Gate</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-monospace,Consolas,monospace;background:#07030d;color:white;overflow:hidden}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 55%,#280c29 0,#09040d 55%,#000 100%)}body:before{content:"";pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 3px,#0002 3px 5px);z-index:10}header{position:absolute;top:20px;left:22px;z-index:20;font-size:clamp(18px,3vw,27px);font-weight:900;letter-spacing:2px;text-shadow:0 0 18px #f13e63;color:#ff6582}header small{display:block;font-size:10px;letter-spacing:3px;color:#a7a0be;margin-top:7px}nav{position:absolute;top:25px;right:24px;z-index:20}nav a{color:#aaa7c6;text-decoration:none;font-size:13px}nav a:hover{color:#fff}.character{position:absolute;width:min(58vmin,390px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 0 25px #ff284766);animation:spin 4s linear infinite;pointer-events:none;z-index:2}@keyframes spin{to{transform:rotate(360deg)}}.prompt{position:fixed;right:24px;bottom:25px;z-index:25;width:min(365px,calc(100vw - 48px));padding:20px;background:#0b0814ed;border:1px solid #923b62;border-radius:12px;box-shadow:0 0 25px #d6286b33}.prompt label{display:block;font-weight:900;color:#ff8da5;font-size:15px;margin-bottom:13px;letter-spacing:.5px}.formrow{display:flex;gap:8px}.prompt input{min-width:0;flex:1;background:#07040b;border:1px solid #5e3655;color:#fff;padding:13px 11px;border-radius:7px;outline:none;font:inherit}.prompt input:focus{border-color:#ff6789}.prompt button{background:#f03c67;border:0;color:#fff;padding:12px 15px;border-radius:7px;font:inherit;font-weight:bold;cursor:pointer}.hint{margin-top:12px;color:#a6a0b6;font-size:11px}.failure{position:fixed;inset:0;z-index:40;background:#000;overflow:hidden;display:none}.failure.active{display:block}.clone{position:absolute;width:clamp(66px,12vw,158px);aspect-ratio:1;object-fit:contain;image-rendering:pixelated;animation:burst .2s ease-out backwards;filter:drop-shadow(0 0 4px red)}@keyframes burst{from{transform:scale(.1) rotate(-60deg);opacity:0}to{transform:scale(1) rotate(var(--turn,0deg));opacity:1}}.failure-text{position:fixed;left:0;right:0;top:43%;text-align:center;color:#fff;background:#0b000dc9;z-index:45;font-weight:1000;font-size:clamp(23px,5vw,64px);text-shadow:3px 3px #d7103b;letter-spacing:2px;padding:10px}.failure-sub{font-size:clamp(12px,2vw,18px);margin-top:7px;letter-spacing:1px}@media(max-width:650px){.character{width:76vmin;top:22%}.prompt{bottom:16px;right:12px;width:calc(100vw - 24px)}header{top:14px;left:13px}}
@media(prefers-reduced-motion:reduce){.character{animation-duration:14s}.clone{animation:none}}
</style></head>
<body><header>NEBULA.FLAMES<small>SECRET ACCESS // AUTHORIZATION REQUIRED</small></header><nav><a href="index.html">← BACK TO NEBULA.NOW</a></nav>
<img src="flame-character.png" class="character" alt="Spinning pixel character with red and blue glowing eyes">
<form class="prompt" id="gate" autocomplete="off"><label for="password">ENTER THE CORRECT PASSWORD</label><div class="formrow"><input id="password" type="password" placeholder="PASSWORD" aria-label="Password" required autofocus><button type="submit">ENTER</button></div><div class="hint">Incorrect password returns you to Nebula.Now.</div></form>
<div class="failure" id="failure" aria-live="assertive"><div class="failure-text">ACCESS DENIED<div class="failure-sub">RETURNING TO NEBULA.NOW...</div></div></div>
<script>
const gate=document.getElementById('gate');const failure=document.getElementById('failure');
let failed=false;
gate.addEventListener('submit',(e)=>{e.preventDefault();if(failed)return;const entered=document.getElementById('password').value;
if(entered==='WHYAREYOUHERE'){window.location.assign('games.html');return;}
failed=true;gate.style.display='none';failure.classList.add('active');
// A visually overwhelming *in-page* flood, not real popup windows (which browsers block).
// Fill the viewport in batches while keeping memory and responsiveness bounded.
let count=0;const total=240;const cols=Math.ceil(Math.sqrt(total*window.innerWidth/Math.max(window.innerHeight,1)));
const rows=Math.ceil(total/cols);
const timer=setInterval(()=>{
 const fragment=document.createDocumentFragment();
 for(let j=0;j<24&&count<total;j++,count++){
  const c=document.createElement('img');c.src='flame-character.png';c.alt='';c.className='clone';
  const x=(count%cols+(Math.random()-.5)*.95)*100/cols;
  const y=(Math.floor(count/cols)+(Math.random()-.5)*.95)*100/rows;
  c.style.left=x+'%';c.style.top=y+'%';c.style.setProperty('--turn',(Math.random()*80-40)+'deg');
  fragment.appendChild(c);
 }
 failure.appendChild(fragment);
 if(count>=total)clearInterval(timer);
},65);
setTimeout(()=>window.location.replace('index.html'),3000);
});
</script></body></html>
