const timer=setInterval(()=>{const batch=document.createDocumentFragment();for(let n=0;n<25&&i<max;n++,i++){let image=document.createElement('img');image.src=src;image.alt='';image.className='clone';image.style.left=((i%cols)+(Math.random()-.5)*.7)*100/cols+'%';image.style.top=(Math.floor(i/cols)+(Math.random()-.5)*.7)*100/rows+'%';image.style.setProperty('--angle',(Math.random()*100-50)+'deg');batch.append(image);}fail.append(batch);if(i>=max)clearInterval(timer);},55);
setTimeout(()=>location.replace('index.html'),2800);
});
</script></body></html>
